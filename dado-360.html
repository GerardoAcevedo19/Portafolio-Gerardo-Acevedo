<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dado · 360°</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#171717;font-family:Arial,sans-serif}
  #visor{width:100%;height:100%;position:relative;min-height:300px}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .controles{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border:1px solid #9995;border-radius:30px;background:#eeeD;backdrop-filter:blur(12px);white-space:nowrap}
  button{font:inherit;font-size:12px;cursor:pointer;background:transparent;color:#222;border:0;padding:9px 13px;border-radius:20px}button:hover{background:#ccc8}button:focus-visible{outline:2px solid #222;outline-offset:2px}
  #estado{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;font-size:14px;pointer-events:none}#estado[hidden]{display:none}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* Controles ocultos desde la primera carga. */
.controles, #giro, #reset { display: none !important; }
#visor { min-height: 0; }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<main id="visor" aria-label="Dado tridimensional interactivo">
  <div id="estado" role="status">Cargando modelo 3D…</div>
  <nav hidden aria-hidden="true" class="controles" aria-label="Controles del modelo">
    <button id="giro" type="button" aria-pressed="true">Pausar giro</button>
    <button id="reset" type="button">Restablecer vista</button>
  </nav>
</main>
<script type="module">
const estado=document.querySelector('#estado');
try {
  const THREE=await import('three');
  const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
  const {RoundedBoxGeometry}=await import('three/addons/geometries/RoundedBoxGeometry.js');
  const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');
  const host=document.querySelector('#visor');
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  host.prepend(renderer.domElement);
  renderer.domElement.setAttribute('aria-label','Arrastra para girar el dado. Usa la rueda o dos dedos para acercar.');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(33,1,0.1,100);
  camera.position.set(4.6,3.3,6);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping=true;
  controls.enablePan=false;
  controls.minDistance=5.8;controls.maxDistance=16;
  controls.minPolarAngle=0.2;controls.maxPolarAngle=Math.PI-0.2;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  controls.autoRotate=!reduced.matches;
  controls.autoRotateSpeed=1.6; // Giro lento y continuo de 360 grados.
  const giro=document.querySelector('#giro');
  function syncButton(){giro.textContent=controls.autoRotate?'Pausar giro':'Activar giro';giro.setAttribute('aria-pressed',String(controls.autoRotate));}
  syncButton();
  giro.onclick=()=>{controls.autoRotate=!controls.autoRotate;syncButton()};
  reduced.addEventListener('change',()=>{controls.autoRotate=!reduced.matches;syncButton()});
  controls.saveState();
  document.querySelector('#reset').onclick=()=>controls.reset();
  const pmrem=new THREE.PMREMGenerator(renderer);
  const room=new RoomEnvironment();
  const environment=pmrem.fromScene(room,0.04);
  scene.environment=environment.texture;
  room.dispose();pmrem.dispose();
  scene.add(new THREE.HemisphereLight(0xffffff,0x343434,2.1));
  function light(x,y,z,power){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l)}
  light(-4,7,6,5);light(5,3,-5,5);light(2,-2,5,1.2);

  // Las caras opuestas suman siete: +X/-X, +Y/-Y, +Z/-Z.
  const layouts={
    1:[[0,0]],
    2:[[-1,1],[1,-1]],
    3:[[-1,1],[0,0],[1,-1]],
    4:[[-1,-1],[1,-1],[-1,1],[1,1]],
    5:[[-1,-1],[1,-1],[0,0],[-1,1],[1,1]],
    6:[[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]
  };
  let seed=1208;
  const noise=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  function face(number){
    const canvas=document.createElement('canvas');canvas.width=canvas.height=512;
    const ctx=canvas.getContext('2d');
    const pixels=ctx.createImageData(512,512);
    for(let i=0;i<pixels.data.length;i+=4){const c=36+Math.floor(noise()*30);pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=c;pixels.data[i+3]=255}
    ctx.putImageData(pixels,0,0);
    const height=document.createElement('canvas');height.width=height.height=512;
    const h=height.getContext('2d');h.fillStyle='#aaa';h.fillRect(0,0,512,512);
    for(const [x,y] of layouts[number]){
      const px=256+x*119,py=256+y*119;
      // Puntos marfil sobre el metal negro y un mapa de relieve cóncavo.
      const fill=ctx.createRadialGradient(px-8,py-8,2,px,py,39);
      fill.addColorStop(0,'#f4f4f4');fill.addColorStop(0.8,'#cecece');fill.addColorStop(1,'#898989');
      ctx.beginPath();ctx.arc(px,py,38,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
      const relief=h.createRadialGradient(px,py,0,px,py,42);
      relief.addColorStop(0,'#222');relief.addColorStop(0.78,'#333');relief.addColorStop(1,'#aaa');
      h.fillStyle=relief;h.fillRect(px-42,py-42,84,84);
    }
    const map=new THREE.CanvasTexture(canvas);map.colorSpace=THREE.SRGBColorSpace;
    map.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
    const bump=new THREE.CanvasTexture(height);
    return new THREE.MeshStandardMaterial({map,bumpMap:bump,bumpScale:0.035,metalness:0.48,roughness:0.4});
  }
  const materials=[1,6,2,5,3,4].map(face);
  const dice=new THREE.Mesh(new RoundedBoxGeometry(2.5,2.5,2.5,6,0.18),materials);
  scene.add(dice);
  // Inclinación leve para mostrar las caras superior y laterales.
  dice.rotation.z=-0.12;
  function resize(){
    const w=host.clientWidth,h=host.clientHeight;
    renderer.setSize(w,h);camera.aspect=w/h;
    // Encuadre que mantiene el dado completo incluso en columnas estrechas.
    const vertical=THREE.MathUtils.degToRad(33);
    camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(vertical/2)/Math.min(1,camera.aspect)));
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);resize();
  // Detener el renderizado cuando el componente no está a la vista.
  let visible=true;
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting}).observe(host);
  let last=performance.now();
  renderer.setAnimationLoop(now=>{
    const delta=Math.min((now-last)/1000,0.05);last=now;
    if(!visible||document.hidden)return;
    controls.update(delta);renderer.render(scene,camera);
  });
  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();estado.textContent='Se perdió el contexto 3D. Recarga la página.';estado.hidden=false});
  estado.hidden=true;
  window.__dice={scene,renderer,camera,controls,model:dice};
} catch(error) {
  estado.hidden=false;estado.textContent='No se pudo cargar el visor 3D. Revisa tu conexión y que WebGL esté habilitado.';
  console.error(error);
}
</script>
</body>
</html>
